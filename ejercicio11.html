<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Km-M</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
    <script src="js/ejercicio11.js"></script>
</head>
<body>
    <div class="contenedor-calculadora">
        <h1>Calculadora</h1>
        <p class="subtitulo">Calculadora de Kilometros a Millas</p>
       
            <div class="grupo-doble">
                <label for="Kilometro">Kilometros</label>
                <input type="number" id="number" step="any" placeholder="Kilometros">
            </div>
            <div class="grupo-doble">
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" placeholder="M" readonly>
            </div>
            <div class="grupo-doble"></div>
             <button type="button" class="boton" onclick="convertir()">Convertir</button>
       
    </div>
    
</body>
</html>
