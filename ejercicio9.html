<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DevSolutions</title>
    <link rel="stylesheet" href="css/ejercicio9.css">

</head>
<body>
    <div class="contenedor-formulario">
        <h1>Contactanos</h1>
        <p class="subtitulo">¿Tienes dudas? Escríbenos y te responderemos en 24h.</p>

        <form class="formulario">
            <!--Grupo 1: Datos basicos-->
            <div class="grupo-formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej: Vania Castellanos" required>
            </div>
            <!--Grupo 2: Email  y teléfono-->
            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="alex@ejemplo.com" required>
                </div>
                <div class="grupo-formulario">
                    <label for="telefono">Teléfono<span>(opcional)</span></label>
                    <input type="tel" id="telefono" placeholder="+52 951 331 85 75">
                </div>
            </div>
            <!--Grupo 3: Mensaje-->
            <div class="grupo-formulario">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Descrube tu consulta..." required></textarea>

            </div>
            <!--Botón-->
            <button type="submit" class="boton-enviar">
                Enviar mensaje <span>-></span>
            </button>
        </form>
    </div>
    
</body>
</html>
